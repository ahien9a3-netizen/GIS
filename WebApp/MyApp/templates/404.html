{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Không Tìm Thấy Trang</title>
    <style>
        /* Import các phông chữ */
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@100;400;600;900&family=Lora:wght@400&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to bottom, #1a1a2e 0%, #161625 50%, #1a1a2e 100%);
            font-family: 'Montserrat', sans-serif; /* Chuyển phông chữ chính sang Montserrat cho chuyên nghiệp */
            overflow: hidden;
            color: #fff;
            perspective: 2000px;
        }

        .cinematic-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- CẢNH NỀN 3D --- */
        .scene {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            transform-style: preserve-3d;
        }

        .forest-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            opacity: 0.5;
        }
        
        .forest-layer::before, .forest-layer::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 100%;
            background: linear-gradient(to top, #111, #333);
            bottom: 0;
            filter: blur(1px);
        }
        .forest-layer::before { left: 10%; }
        .forest-layer::after { left: 80%; }
        
        .mist-river {
            position: absolute;
            width: 200%;
            height: 30%;
            bottom: 0;
            left: -50%;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%);
            filter: blur(20px);
            animation: mist-drift 60s linear infinite;
            mask-image: linear-gradient(to top, black 20%, transparent 80%);
            -webkit-mask-image: linear-gradient(to top, black 20%, transparent 80%);
        }

        .lantern-group {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            transform-style: preserve-3d;
        }

        .lantern {
            position: absolute;
            width: 15px;
            height: 25px;
            background: linear-gradient(to bottom, #ffc880 0%, #fff 50%, #ffc880 100%);
            border-radius: 5px;
            box-shadow: 0 0 10px #ffc880, 0 0 20px #ffc880;
            opacity: 0.8;
            animation: lantern-float 15s linear infinite;
        }
        
        .lantern::after {
            content: '';
            position: absolute;
            width: 2px;
            height: 10px;
            background-color: #333;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
        }

        .l1 { bottom: 0%; left: 10%; animation-delay: 0s; width: 10px; height: 18px; }
        .l2 { bottom: -5%; left: 30%; animation-delay: 3s; width: 20px; height: 32px; }
        .l3 { bottom: 2%; left: 60%; animation-delay: 6s; }
        .l4 { bottom: -10%; left: 85%; animation-delay: 9s; width: 12px; height: 20px; }
        .l5 { bottom: 5%; left: 50%; animation-delay: 12s; width: 18px; height: 28px; }

        .moon {
            position: absolute;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle at 40% 40%, rgba(255, 255, 255, 1) 0%, rgba(255, 255, 255, 0.5) 40%, transparent 60%);
            border-radius: 50%;
            top: 5%;
            left: 5%;
            filter: blur(2px);
            box-shadow: 0 0 80px rgba(255, 255, 255, 0.4);
            animation: moon-glow 8s infinite alternate;
        }

        /* --- NỘI DUNG CHÍNH --- */
        .content-card {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 700px;
            width: 90%;
            padding: 4rem;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            animation: card-appear 1.5s ease-out;
            transform-style: preserve-3d;
        }

        .error-code-container {
            position: relative;
            display: inline-flex;
            align-items: flex-end;
            margin-bottom: 20px;
            transform-style: preserve-3d;
        }

        .error-code {
            font-size: 160px;
            font-weight: 100;
            line-height: 0.8;
            letter-spacing: -5px;
            color: transparent;
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.1);
            background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.2) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
            animation: glow-pulse 3s infinite;
        }

        .code-moon {
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(255,255,255,0.2) 70%, transparent 90%);
            border-radius: 50%;
            margin: 0 10px;
            filter: blur(1px);
            box-shadow: 0 0 40px rgba(255,255,255,0.6);
            transform: translateY(-20px) translateZ(50px);
            animation: code-moon-pulse 4s infinite;
        }

        .error-title {
            font-size: 2rem;
            font-weight: 600; /* Đổi sang đậm vừa để trông chuyên nghiệp */
            margin-bottom: 20px;
            color: #ffffff;
            letter-spacing: 1px;
            /* Đã bỏ font-style: italic */
        }

        .error-desc {
            font-family: 'Lora', serif;
            font-size: 1.1rem;
            margin-bottom: 50px;
            color: #d8ced1;
            line-height: 1.8;
            letter-spacing: 0.5px;
            font-weight: 400;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .btn-home {
            display: inline-block;
            padding: 16px 45px;
            font-size: 0.95rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
            background: rgba(255, 255, 255, 0.05); /* Thêm nền nhẹ cho nút */
            text-decoration: none;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.05);
            overflow: hidden;
            position: relative;
        }

        .btn-home:hover {
            border-color: rgba(255, 255, 255, 1);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.15);
            transform: translateY(-3px) scale(1.03);
        }
        
        .btn-home::before {
            content: '';
            position: absolute;
            top: 50%;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: all 0.6s;
        }
        
        .btn-home:hover::before {
            left: 100%;
        }

        /* --- ANIMATIONS --- */
        @keyframes moon-glow {
            0%, 100% { box-shadow: 0 0 80px rgba(255, 255, 255, 0.4); }
            50% { box-shadow: 0 0 120px rgba(255, 255, 255, 0.6), 0 0 10px #fff; }
        }
        @keyframes mist-drift {
            0% { transform: translateX(0); }
            100% { transform: translateX(100vw); }
        }
        @keyframes lantern-float {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
        @keyframes card-appear {
            0% { opacity: 0; transform: translateY(50px) scale(0.9); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes glow-pulse {
            0%, 100% { -webkit-text-stroke: 1px rgba(255, 255, 255, 0.1); text-shadow: 0 0 30px rgba(255, 255, 255, 0.3); }
            50% { -webkit-text-stroke: 1px rgba(255, 255, 255, 0.3); text-shadow: 0 0 60px rgba(255, 255, 255, 0.6), 0 0 10px #fff; }
        }
        @keyframes code-moon-pulse {
            0%, 100% { transform: translateY(-20px) translateZ(50px) scale(1); box-shadow: 0 0 40px rgba(255,255,255,0.6); }
            50% { transform: translateY(-20px) translateZ(50px) scale(1.1); box-shadow: 0 0 60px rgba(255,255,255,0.8), 0 0 10px #fff; }
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 600px) {
            .error-code { font-size: 110px; }
            .code-moon { width: 80px; height: 80px; transform: translateY(-10px) translateZ(50px); }
            .error-title { font-size: 1.5rem; }
            .error-desc { font-size: 1rem; padding: 0 10px; }
            .content-card { padding: 3rem 1.5rem; }
            .moon { width: 180px; height: 180px; top: 2%; left: 2%; }
        }
    </style>
</head>
<body>

    <div class="cinematic-container">
        <div class="scene">
            <div class="forest-layer"></div>
            <div class="moon"></div>
            <div class="mist-river"></div>
            <div class="lantern-group">
                <div class="lantern l1"></div>
                <div class="lantern l2"></div>
                <div class="lantern l3"></div>
                <div class="lantern l4"></div>
                <div class="lantern l5"></div>
            </div>
        </div>

        <div class="content-card">
            <div class="error-code-container">
                <span class="error-code">4</span>
                <div class="code-moon"></div>
                <span class="error-code">4</span>
            </div>
            <h2 class="error-title">Không Tìm Thấy Trang</h2>
            <p class="error-desc">
                Đường dẫn bạn vừa truy cập không tồn tại, đã bị thay đổi hoặc tạm thời không thể truy cập. Vui lòng kiểm tra lại địa chỉ URL hoặc trở về trang chủ để tiếp tục.
            </p>
            <div class="btn-wrap">
                <a href="{% url 'home' %}" class="btn-home">Quay Lại Trang Chủ</a>
            </div>
        </div>
    </div>

</body>
</html>
