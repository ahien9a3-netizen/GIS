{% extends 'myapp/base.html' %}
{% block content %}

<h3>Phân tích vùng phục vụ cửa hàng</h3>

<form method="get">
    <label>Chọn cửa hàng:</label>
    <select name="mach" onchange="this.form.submit()">
        <option value="">-- Chọn --</option>
        {% for ch in cua_hangs %}
            <option value="{{ ch.MaCH }}"
                {% if ch.MaCH == selected_mach %}selected{% endif %}
            >
                {{ ch.Ten }}
            </option>
        {% endfor %}
    </select>
</form>

<br>
<div id="map" style="height:500px;"></div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    var map = L.map('map').setView([10.7769, 106.7009], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
        .addTo(map);

    {% for ch in cua_hangs %}
        L.marker([{{ ch.geom.y }}, {{ ch.geom.x }}])
            .addTo(map)
            .bindPopup("{{ ch.Ten }}");
    {% endfor %}

    {% if buffer_geojson %}
        var buffer = L.geoJSON({{ buffer_geojson|safe }}, {
            style: {
                color: 'blue',
                fillOpacity: 0.2
            }
        }).addTo(map);

        map.fitBounds(buffer.getBounds());
    {% endif %}
</script>

{% endblock %}
