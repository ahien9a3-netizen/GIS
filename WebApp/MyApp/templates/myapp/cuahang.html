<script>
var map = L.map('map').setView([10.78, 106.68], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

var data = ([geojson|safe ]);

L.geoJSON(data, {
    onEachFeature: function (feature, layer) {
        layer.bindPopup(
            "<b>" + feature.properties.Ten + "</b><br>" +
            feature.properties.DiaChi
        );
    }
}).addTo(map);
</script>
