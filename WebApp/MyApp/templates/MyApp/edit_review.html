{% extends 'MyApp/base.html' %}

{% block content %}
<div style="max-width: 800px; margin: 0 auto; padding: 2rem 0;">
    <a href="{% url 'store_detail' store.MaCH %}" style="display: inline-block; margin-bottom: 1.5rem; color: #64748b; text-decoration: none; font-weight: 600;">
        <i class="fa-solid fa-arrow-left"></i> Quay lại cửa hàng {{ store.Ten }}
    </a>

    <div class="chart-card" style="padding: 2.5rem; background: white; border-radius: 20px; box-shadow: var(--shadow-md); border: 1px solid var(--gray-200);">
        <h3 style="margin-bottom: 2rem; color: #1e293b;"><i class="fa-solid fa-pen-to-square" style="color: #3b82f6;"></i> Chỉnh sửa bài đánh giá của bạn</h3>

        <form method="post">
            {% csrf_token %}
            
            <div style="margin-bottom: 2rem;">
                <label style="font-weight: 700; margin-bottom: 0.5rem; display: block; color: var(--gray-700); font-size: 1.1rem;">Điểm đánh giá</label>
                <div class="interactive-stars" style="font-size: 2.5rem; color: #cbd5e1; cursor: pointer; display: flex; gap: 8px;">
                    <i class="fa-solid fa-star" data-val="1"></i>
                    <i class="fa-solid fa-star" data-val="2"></i>
                    <i class="fa-solid fa-star" data-val="3"></i>
                    <i class="fa-solid fa-star" data-val="4"></i>
                    <i class="fa-solid fa-star" data-val="5"></i>
                </div>
                <div style="display: none;">{{ form.SoSao }}</div>
            </div>

            <div style="margin-bottom: 2rem;">
                <label style="font-weight: 700; margin-bottom: 0.5rem; display: block; color: var(--gray-700); font-size: 1.1rem;">Nhận xét chi tiết</label>
                {{ form.NhanXet }}
            </div>

            <div style="display: flex; gap: 1rem;">
                <button type="submit" style="background: #01875f; color: white; padding: 0.8rem 2rem; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 1rem;">Cập nhật</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const stars = document.querySelectorAll('.interactive-stars i');
        const hiddenInput = document.querySelector('input[name="SoSao"]');
        
        // Lấy số sao cũ từ database để tô màu sẵn
        const currentVal = hiddenInput.value || 5;
        highlightStars(currentVal);

        stars.forEach(star => {
            star.addEventListener('click', function() {
                const val = this.getAttribute('data-val');
                hiddenInput.value = val;
                highlightStars(val);
            });
        });

        function highlightStars(val) {
            stars.forEach(s => {
                if (s.getAttribute('data-val') <= val) {
                    s.style.color = '#01875f'; 
                } else {
                    s.style.color = '#cbd5e1'; 
                }
            });
        }
    });
</script>
{% endblock %}
