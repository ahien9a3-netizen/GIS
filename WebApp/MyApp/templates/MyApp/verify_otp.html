<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác thực OTP - SMART MART</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f8fafc;
        }

        .otp-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3rem;
            border-radius: 2rem;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .icon-box {
            width: 70px;
            height: 70px;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            font-size: 1.75rem;
            color: #818cf8;
        }

        h2 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.75rem; }
        p { color: #94a3b8; margin-bottom: 2.5rem; font-size: 0.9375rem; line-height: 1.6; }

        .otp-inputs {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            margin-bottom: 2rem;
        }
        .otp-inputs input {
            width: 50px;
            height: 60px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
            color: white;
            transition: all 0.2s;
        }
        .otp-inputs input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
            transform: translateY(-2px);
        }

        .btn-verify {
            width: 100%;
            padding: 1rem;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 1rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-verify:hover {
            background: #4f46e5;
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
        }

        .alert-error {
            padding: 1rem;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 1rem;
            color: #fca5a5;
            margin-bottom: 2rem;
            font-size: 0.875rem;
        }

        .resend-text {
            margin-top: 2rem;
            font-size: 0.875rem;
            color: #64748b;
        }
        .resend-text a {
            color: #818cf8;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="otp-card">
        <div class="icon-box">
            <i class="fas fa-envelope-open-text"></i>
        </div>
        
        <h2>Xác thực OTP</h2>
        <p>Chúng tôi đã gửi mã xác thực gồm 6 chữ số đến Gmail của bạn. Vui lòng kiểm tra và nhập mã bên dưới.</p>

        {% if error %}
        <div class="alert-error">
            <i class="fas fa-exclamation-triangle"></i> {{ error }}
        </div>
        {% endif %}

        <form method="POST" id="otp-form">
            {% csrf_token %}
            <div class="otp-inputs">
                <input type="text" name="digit1" maxlength="1" pattern="[0-9]" required autofocus>
                <input type="text" name="digit2" maxlength="1" pattern="[0-9]" required>
                <input type="text" name="digit3" maxlength="1" pattern="[0-9]" required>
                <input type="text" name="digit4" maxlength="1" pattern="[0-9]" required>
                <input type="text" name="digit5" maxlength="1" pattern="[0-9]" required>
                <input type="text" name="digit6" maxlength="1" pattern="[0-9]" required>
            </div>
            <button type="submit" class="btn-verify">Xác thực mã</button>
        </form>

        <div class="resend-text">
            Không nhận được mã? <a href="{% url 'forgot_password' %}">Gửi lại yêu cầu</a>
        </div>
    </div>

    <script>
        const inputs = document.querySelectorAll('.otp-inputs input');
        
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length > 1) {
                    e.target.value = e.target.value.slice(0, 1);
                }
                if (e.target.value && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });
    </script>
</body>
</html>
