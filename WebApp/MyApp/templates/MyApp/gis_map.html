{% extends 'MyApp/base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
    .gis-map-container {
        height: calc(100vh - var(--header-height) - 4rem);
        width: 100%;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: var(--shadow-lg);
        position: relative;
    }

    #full-gis-map {
        height: 100%;
        width: 100%;
    }

    .map-overlay-controls {
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 1000;
        background: white;
        padding: 1rem;
        border-radius: 8px;
        box-shadow: var(--shadow-md);
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }

    .btn-locate {
        position: absolute;
        bottom: 25px;
        right: 20px;
        z-index: 1000;
        background: white;
        border: 1px solid var(--gray-300);
        width: 44px;
        height: 44px;
        border-radius: 8px;
        cursor: pointer;
        color: var(--gray-700);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: var(--shadow-md);
        transition: all 0.2s;
    }

    .btn-locate:hover {
        background: var(--gray-50);
        color: var(--primary);
    }

    /* Marker Vị trí của tôi (Pulsing) */
    .user-location-marker {
        width: 18px;
        height: 18px;
        background: #10b981;
        border: 3px solid white;
        border-radius: 50%;
        position: relative;
    }

    .user-location-marker::after {
        content: '';
        width: 40px;
        height: 40px;
        background: rgba(16, 185, 129, 0.3);
        border-radius: 50%;
        position: absolute;
        top: -14px;
        left: -14px;
        animation: pulse 2s infinite;
    }

    @keyframes pulse {
        0% {
            transform: scale(0.5);
            opacity: 1;
        }

        100% {
            transform: scale(1.5);
            opacity: 0;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Bản đồ GIS Chuyên sâu</h1>
    <p>Phân tích mạng lưới cửa hàng và kho hàng trên nền tảng địa không gian</p>
</div>

<div class="gis-map-container">
    <div id="full-gis-map"></div>

    <!-- Các nút điều khiển nổi -->
    <div class="map-overlay-controls">
        <button id="btn-analysis" class="leaflet-analysis-btn">
            <i class="fa-solid fa-magnifying-glass-location"></i> Phân tích vùng phục vụ
        </button>
    </div>

    <!-- Nút định vị -->
    <button id="btn-locate-user" class="btn-locate" title="Vị trí của tôi">
        <i class="fa-solid fa-crosshairs fa-lg"></i>
    </button>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        var map = L.map('full-gis-map').setView([10.7769, 106.7009], 12);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        var storesLayer = L.layerGroup().addTo(map);
        var warehousesLayer = L.layerGroup().addTo(map);
        var serviceLayer = L.layerGroup().addTo(map);
        var heatLayer;

        // Load Stores
        fetch('/api/stores-geojson/')
            .then(res => res.json())
            .then(data => {
                L.geoJSON(data, {
                    pointToLayer: (feature, latlng) => {
                        let color = '#3b82f6';
                        let icon = 'fa-store';
                        const type = feature.properties.type;

                        if (type === 'Tiện Lợi') { color = '#3b82f6'; icon = 'fa-cart-shopping'; }
                        else if (type === 'Gia Dụng') { color = '#0d9488'; icon = 'fa-house-chimney'; }
                        else if (type === 'Điện Tử') { color = '#f59e0b'; icon = 'fa-bolt'; }

                        return L.marker(latlng, {
                            icon: L.divIcon({
                                className: 'custom-marker',
                                html: `<div style="background: ${color}; color: white; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 3px solid white;"><i class="fa-solid ${icon}"></i></div>`,
                                iconSize: [30, 30]
                            })
                        });
                    },
                    onEachFeature: (feature, layer) => {
                        layer.bindPopup(`<strong>${feature.properties.name}</strong><br><span style="background: #eee; padding: 2px 5px; border-radius: 4px; font-size: 11px;">${feature.properties.type}</span><br>${feature.properties.address}`);
                    }
                }).addTo(storesLayer);
                if (storesLayer.getLayers().length > 0) map.fitBounds(storesLayer.getBounds().pad(0.1));
            });

        // Load Warehouses
        fetch('/api/kho-geojson/')
            .then(res => res.json())
            .then(data => {
                L.geoJSON(data, {
                    pointToLayer: (feature, latlng) => L.marker(latlng, {
                        icon: L.divIcon({
                            className: 'custom-marker',
                            html: '<div style="background: #ef4444; color: white; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 3px solid white;"><i class="fa-solid fa-warehouse"></i></div>',
                            iconSize: [30, 30]
                        })
                    }),
                    onEachFeature: (feature, layer) => {
                        layer.bindPopup(`<strong>KHO: ${feature.properties.name}</strong><br>${feature.properties.address}`);
                    }
                }).addTo(warehousesLayer);
            });

        // Heatmap
        fetch('/api/stores-heatmap/')
            .then(res => res.json())
            .then(data => {
                heatLayer = L.heatLayer(data, { radius: 25, blur: 15 });
                L.control.layers(null, {
                    "Cửa hàng": storesLayer,
                    "Kho hàng": warehousesLayer,
                    "Bản đồ nhiệt": heatLayer
                }).addTo(map);
            });

        // Analysis logic
        var isAnalysisMode = false;
        document.getElementById('btn-analysis').onclick = function () {
            isAnalysisMode = !isAnalysisMode;
            this.style.background = isAnalysisMode ? '#ef4444' : '#3b82f6';
            this.innerHTML = isAnalysisMode ? '<i class="fa-solid fa-xmark"></i> Hủy' : '<i class="fa-solid fa-magnifying-glass-location"></i> Phân tích';
            map.getContainer().style.cursor = isAnalysisMode ? 'crosshair' : '';
            if (!isAnalysisMode) serviceLayer.clearLayers();
        };

        map.on('click', function (e) {
            if (!isAnalysisMode) return;
            serviceLayer.clearLayers();
            L.circle(e.latlng, { radius: 2000, color: '#ef4444', fillOpacity: 0.1 }).addTo(serviceLayer);

            fetch(`/api/service-area/?lat=${e.latlng.lat}&lng=${e.latlng.lng}&radius=2`)
                .then(res => res.json())
                .then(data => {
                    L.geoJSON(data.stores, {
                        pointToLayer: (f, l) => L.circleMarker(l, { radius: 8, fillColor: '#ff7800', color: '#fff', weight: 2, fillOpacity: 0.8 }),
                        onEachFeature: (f, l) => l.bindPopup(`Trong vùng: <strong>${f.properties.name}</strong><br>Cách: ${f.properties.distance_km}km`)
                    }).addTo(serviceLayer);
                });
        });

        // Định vị người dùng
        var userMarker;
        document.getElementById('btn-locate-user').onclick = function () {
            if (!navigator.geolocation) {
                alert("Trình duyệt không hỗ trợ định vị!");
                return;
            }
            navigator.geolocation.getCurrentPosition(pos => {
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                if (userMarker) userMarker.setLatLng([lat, lng]);
                else {
                    userMarker = L.marker([lat, lng], {
                        icon: L.divIcon({ className: 'user-location-marker', iconSize: [18, 18], iconAnchor: [9, 9] })
                    }).addTo(map);
                }
                map.setView([lat, lng], 15);
            }, err => alert("Không thể định vị. Vui lòng cấp quyền truy cập vị trí!"));
        };
    });
</script>
{% endblock %}
