{% extends 'MyApp/base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
<style>
    .gis-map-container {
        height: calc(100vh - var(--header-height) - 4rem);
        width: 100%;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: var(--shadow-lg);
        position: relative;
    }

    #full-gis-map {
        height: 100%;
        width: 100%;
    }

    .map-overlay-controls {
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 1000;
        background: white;
        padding: 1rem;
        border-radius: 8px;
        box-shadow: var(--shadow-md);
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }

    .btn-locate {
        position: absolute;
        bottom: 25px;
        right: 20px;
        z-index: 1000;
        background: white;
        border: 1px solid var(--gray-300);
        width: 44px;
        height: 44px;
        border-radius: 8px;
        cursor: pointer;
        color: var(--gray-700);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: var(--shadow-md);
        transition: all 0.2s;
    }

    .btn-locate:hover {
        background: var(--gray-50);
        color: var(--primary);
    }

    
    .user-location-marker {
        width: 18px;
        height: 18px;
        background: #10b981;
        border: 3px solid white;
        border-radius: 50%;
        position: relative;
    }

    .user-location-marker::after {
        content: '';
        width: 40px;
        height: 40px;
        background: rgba(16, 185, 129, 0.3);
        border-radius: 50%;
        position: absolute;
        top: -14px;
        left: -14px;
        animation: pulse 2s infinite;
    }

    @keyframes pulse {
        0% {
            transform: scale(0.5);
            opacity: 1;
        }

        100% {
            transform: scale(1.5);
            opacity: 0;
        }
    }

   
    .leaflet-routing-container {
        background-color: white !important;
        padding: 10px !important;
        border-radius: 8px !important;
        box-shadow: var(--shadow-md) !important;
        border: 1px solid var(--gray-200) !important;
        max-height: 300px !important;
        overflow-y: auto !important;
        font-family: inherit !important;
        width: 280px !important;
    }

    .leaflet-routing-alt h2 {
        font-size: 14px !important;
        color: var(--primary) !important;
    }

    .leaflet-routing-alt table {
        font-size: 12px !important;
    }

    /* Popup Trực quan hơn */
    .leaflet-popup-content-wrapper {
        border-radius: 12px;
        padding: 5px;
    }

    .popup-info-card {
        padding: 5px;
        min-width: 200px;
    }

    .popup-header {
        border-bottom: 1px solid #eee;
        padding-bottom: 8px;
        margin-bottom: 8px;
    }

    .popup-title {
        font-weight: 700;
        color: var(--dark);
        font-size: 1rem;
        display: block;
    }

    .popup-badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        margin-top: 4px;
    }

    .popup-body {
        font-size: 0.85rem;
        color: var(--gray-600);
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .popup-row {
        display: flex;
        align-items: flex-start;
        gap: 8px;
    }

    .popup-row i {
        color: var(--primary);
        width: 14px;
        margin-top: 2px;
    }
</style>
{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Bản đồ GIS Chuyên sâu</h1>
    <p>Phân tích mạng lưới cửa hàng và kho hàng trên nền tảng địa không gian</p>
</div>

<div class="gis-map-container">
    <div id="full-gis-map"></div>

    
    <div class="map-overlay-controls">
        <button id="btn-heatmap" class="leaflet-analysis-btn" style="background: #7c3aed;">
            <i class="fa-solid fa-fire"></i> Mật độ cửa hàng
        </button>
        <button id="btn-route" class="leaflet-analysis-btn" style="background: #10b981;">
            <i class="fa-solid fa-route"></i> Đo quãng đường
        </button>
        <button id="btn-analysis" class="leaflet-analysis-btn">
            <i class="fa-solid fa-magnifying-glass-location"></i> Phân tích vùng phục vụ
        </button>
    </div>

    
    <div
        style="position: absolute; bottom: 85px; right: 20px; z-index: 1000; background: white; padding: 12px; border-radius: 8px; box-shadow: var(--shadow-md); border: 1px solid #eee; font-size: 0.8rem; min-width: 140px;">
        <div
            style="font-weight: 700; margin-bottom: 8px; color: #64748b; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.5px;">
            Chú giải</div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <div
                    style="width: 12px; height: 12px; border-radius: 50%; background: #3b82f6; border: 2px solid white; box-shadow: 0 0 0 1px #3b82f6;">
                </div>
                <span>Tiện Lợi</span>
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
                <div
                    style="width: 12px; height: 12px; border-radius: 50%; background: #0d9488; border: 2px solid white; box-shadow: 0 0 0 1px #0d9488;">
                </div>
                <span>Gia Dụng</span>
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
                <div
                    style="width: 12px; height: 12px; border-radius: 50%; background: #f59e0b; border: 2px solid white; box-shadow: 0 0 0 1px #f59e0b;">
                </div>
                <span>Điện Tử</span>
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
                <div style="width: 12px; height: 12px; border-radius: 2px; background: #ef4444;"></div>
                <span>Kho Hàng</span>
            </div>
        </div>
    </div>

    
    <button id="btn-locate-user" class="btn-locate" title="Vị trí của tôi">
        <i class="fa-solid fa-crosshairs fa-lg"></i>
    </button>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        var map = L.map('full-gis-map').setView([10.7769, 106.7009], 12);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        var storesLayer = L.layerGroup().addTo(map);
        var warehousesLayer = L.layerGroup().addTo(map);
        var serviceLayer = L.layerGroup().addTo(map);
        var heatLayer;

        
        fetch('/api/stores-geojson/')
            .then(res => res.json())
            .then(data => {
                L.geoJSON(data, {
                    pointToLayer: (feature, latlng) => {
                        let color = '#3b82f6';
                        let icon = 'fa-store';
                        const type = feature.properties.type;

                        if (type === 'Tiện Lợi') { color = '#3b82f6'; icon = 'fa-cart-shopping'; }
                        else if (type === 'Gia Dụng') { color = '#0d9488'; icon = 'fa-house-chimney'; }
                        else if (type === 'Điện Tử') { color = '#f59e0b'; icon = 'fa-bolt'; }

                        return L.marker(latlng, {
                            icon: L.divIcon({
                                className: 'custom-marker',
                                html: `<div style="background: ${color}; color: white; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 3px solid white;"><i class="fa-solid ${icon}"></i></div>`,
                                iconSize: [30, 30]
                            })
                        });
                    },
                    onEachFeature: (feature, layer) => {
                        const props = feature.properties;
                        let statusColor = props.status === 'Đang hoạt động' ? '#10b981' : '#f59e0b';

                        const popupHtml = `
                            <div class="popup-info-card">
                                <div class="popup-header">
                                    <span class="popup-title">${props.name}</span>
                                    <span class="popup-badge" style="background: rgba(59, 130, 246, 0.1); color: #3b82f6;">${props.type}</span>
                                    <span class="popup-badge" style="background: ${statusColor}22; color: ${statusColor}; margin-left: 5px;">${props.status || 'Ổn định'}</span>
                                </div>
                                <div class="popup-body">
                                    <div class="popup-row">
                                        <i class="fa-solid fa-location-dot"></i>
                                        <span>${props.address}</span>
                                    </div>
                                    <div class="popup-row">
                                        <i class="fa-solid fa-phone"></i>
                                        <span>${props.phone}</span>
                                    </div>
                                    <div class="popup-row">
                                        <i class="fa-solid fa-barcode"></i>
                                        <span>Mã: <strong>${props.id}</strong></span>
                                    </div>
                                </div>
                            </div>
                        `;
                        layer.bindPopup(popupHtml);
                    }
                }).addTo(storesLayer);
                if (storesLayer.getLayers().length > 0) map.fitBounds(storesLayer.getBounds().pad(0.1));
            });

        
        fetch('/api/kho-geojson/')
            .then(res => res.json())
            .then(data => {
                L.geoJSON(data, {
                    pointToLayer: (feature, latlng) => L.marker(latlng, {
                        icon: L.divIcon({
                            className: 'custom-marker',
                            html: '<div style="background: #ef4444; color: white; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 3px solid white;"><i class="fa-solid fa-warehouse"></i></div>',
                            iconSize: [30, 30]
                        })
                    }),
                    onEachFeature: (feature, layer) => {
                        const props = feature.properties;
                        const popupHtml = `
                            <div class="popup-info-card">
                                <div class="popup-header">
                                    <span class="popup-title"><i class="fa-solid fa-warehouse" style="color:#ef4444"></i> ${props.name}</span>
                                    <span class="popup-badge" style="background: rgba(239, 68, 68, 0.1); color: #ef4444;">KHO HÀNG</span>
                                </div>
                                <div class="popup-body">
                                    <div class="popup-row">
                                        <i class="fa-solid fa-location-dot" style="color:#ef4444"></i>
                                        <span>${props.address}</span>
                                    </div>
                                    <div class="popup-row">
                                        <i class="fa-solid fa-barcode" style="color:#ef4444"></i>
                                        <span>Mã kho: <strong>${props.id}</strong></span>
                                    </div>
                                </div>
                            </div>
                        `;
                        layer.bindPopup(popupHtml);
                    }
                }).addTo(warehousesLayer);
            });

        
        var isHeatmapActive = false;
        document.getElementById('btn-heatmap').onclick = function () {
            isHeatmapActive = !isHeatmapActive;
            this.style.background = isHeatmapActive ? '#4c1d95' : '#7c3aed';
            this.style.boxShadow = isHeatmapActive ? 'inset 0 2px 4px rgba(0,0,0,0.2)' : 'var(--shadow-md)';

            if (isHeatmapActive) {
                if (!heatLayer) {
                    fetch('/api/stores-heatmap/')
                        .then(res => res.json())
                        .then(data => {
                            heatLayer = L.heatLayer(data, { radius: 25, blur: 15 }).addTo(map);
                        });
                } else {
                    map.addLayer(heatLayer);
                }
            } else {
                if (heatLayer) map.removeLayer(heatLayer);
            }
        };

        
        L.control.layers(null, {
            "Cửa hàng": storesLayer,
            "Kho hàng": warehousesLayer
        }, { position: 'topleft' }).addTo(map);

        
        var isAnalysisMode = false;

        function resetStorePopups() {
            storesLayer.eachLayer(function (layer) {
                if (layer.eachLayer) {
                    layer.eachLayer(function (marker) {
                        if (marker._originalPopupContent) {
                            marker.bindPopup(marker._originalPopupContent);
                            delete marker._originalPopupContent;
                        }
                    });
                }
            });
        }

        document.getElementById('btn-analysis').onclick = function () {
            isAnalysisMode = !isAnalysisMode;
            this.style.background = isAnalysisMode ? '#ef4444' : '#3b82f6';
            this.innerHTML = isAnalysisMode ? '<i class="fa-solid fa-xmark"></i> Hủy' : '<i class="fa-solid fa-magnifying-glass-location"></i> Phân tích';
            map.getContainer().style.cursor = isAnalysisMode ? 'crosshair' : '';
            if (!isAnalysisMode) {
                serviceLayer.clearLayers();
                resetStorePopups();
            }
        };

        map.on('click', function (e) {
            if (!isAnalysisMode) return;
            serviceLayer.clearLayers();
            resetStorePopups();

            
            const radiusMeters = 5000;
            const circle = L.circle(e.latlng, {
                radius: radiusMeters,
                color: '#ef4444',
                fillColor: '#ef4444',
                fillOpacity: 0.15,
                weight: 2
            }).addTo(serviceLayer);

            
            circle.bindPopup("Đang phân tích vùng 5km...").openPopup();

            fetch(`/api/service-area/?lat=${e.latlng.lat}&lng=${e.latlng.lng}&radius=5`)
                .then(res => res.json())
                .then(data => {
                    const count = data.stores.features.length;

                    if (count === 0) {
                        circle.setPopupContent("Không tìm thấy cửa hàng nào trong bán kính 5km.").openPopup();
                    } else {
                        circle.setPopupContent(`Tìm thấy <strong>${count}</strong> cửa hàng trong bán kính 5km.`).openPopup();

                        
                        const distMap = {};
                        data.stores.features.forEach(f => {
                            distMap[f.properties.id] = f.properties.distance_km;
                        });

                        
                        storesLayer.eachLayer(function (layer) {
                            if (layer.eachLayer) {
                                layer.eachLayer(function (marker) {
                                    const props = marker.feature.properties;
                                    const dist = distMap[props.id];

                                    if (dist !== undefined) {
                                        
                                        if (!marker._originalPopupContent) {
                                            marker._originalPopupContent = marker.getPopup().getContent();
                                        }

                                        
                                        const newPopupHtml = `
                                            <div class="popup-info-card">
                                                <div class="popup-header">
                                                    <span class="popup-title" style="color: #c2410c;">${props.name}</span>
                                                    <span class="popup-badge" style="background: rgba(239, 68, 68, 0.1); color: #ef4444;">TRONG VÙNG PHỤC VỤ</span>
                                                </div>
                                                <div class="popup-body">
                                                    <div class="popup-row">
                                                        <i class="fa-solid fa-location-dot" style="color: #c2410c;"></i>
                                                        <span>Khoảng cách: <strong>${dist} km</strong></span>
                                                    </div>
                                                    <div class="popup-row">
                                                        <i class="fa-solid fa-map-pin"></i>
                                                        <span>${props.address}</span>
                                                    </div>
                                                    <div class="popup-row">
                                                        <i class="fa-solid fa-phone"></i>
                                                        <span>${props.phone}</span>
                                                    </div>
                                                </div>
                                            </div>
                                        `;
                                        marker.bindPopup(newPopupHtml);
                                    }
                                });
                            }
                        });
                    }
                })
                .catch(err => {
                    circle.setPopupContent("Lỗi khi kết nối máy chủ!").openPopup();
                });
        });

       
        var isRouteMode = false;
        var routePoints = [];
        var routingControl;

        document.getElementById('btn-route').onclick = function () {
            isRouteMode = !isRouteMode;
            this.style.background = isRouteMode ? '#059669' : '#10b981';
            this.innerHTML = isRouteMode ? '<i class="fa-solid fa-xmark"></i> Hủy đo' : '<i class="fa-solid fa-route"></i> Đo quãng đường';

            if (!isRouteMode) {
                if (routingControl) map.removeControl(routingControl);
                routePoints = [];
                map.getContainer().style.cursor = '';
            } else {
                map.getContainer().style.cursor = 'help';
                alert("Hãy click chọn 2 điểm trên bản đồ (Cửa hàng, Kho hoặc Vị trí của mình) để đo quãng đường!");
            }
        };

        map.on('click', function (e) {
            if (!isRouteMode) return;

            routePoints.push(e.latlng);
            L.circleMarker(e.latlng, { radius: 5, color: '#10b981' }).addTo(map).fadeOut(2000);

            if (routePoints.length === 2) {
                if (routingControl) map.removeControl(routingControl);

                routingControl = L.Routing.control({
                    waypoints: [
                        L.latLng(routePoints[0].lat, routePoints[0].lng),
                        L.latLng(routePoints[1].lat, routePoints[1].lng)
                    ],
                    lineOptions: {
                        styles: [{ color: '#10b981', weight: 6, opacity: 0.8 }]
                    },
                    position: 'topleft',
                    collapsible: true,
                    createMarker: function () { return null; }
                }).addTo(map);

                routePoints = []; 
            }
        });

        
        L.Layer.prototype.fadeOut = function (duration) {
            var self = this;
            var opacity = 1;
            var interval = 50;
            var gap = interval / duration;
            var fade = setInterval(function () {
                opacity -= gap;
                if (opacity <= 0) {
                    clearInterval(fade);
                    if (map.hasLayer(self)) map.removeLayer(self);
                } else {
                    self.setStyle({ opacity: opacity, fillOpacity: opacity });
                }
            }, interval);
        };

        
        var userMarker;
        document.getElementById('btn-locate-user').onclick = function () {
            if (!navigator.geolocation) {
                alert("Trình duyệt không hỗ trợ định vị!");
                return;
            }
            navigator.geolocation.getCurrentPosition(pos => {
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                if (userMarker) userMarker.setLatLng([lat, lng]);
                else {
                    userMarker = L.marker([lat, lng], {
                        icon: L.divIcon({ className: 'user-location-marker', iconSize: [18, 18], iconAnchor: [9, 9] })
                    }).addTo(map);
                }
                map.setView([lat, lng], 15);
            }, err => alert("Không thể định vị. Vui lòng cấp quyền truy cập vị trí!"));
        };
    });
</script>
{% endblock %}
