{% extends 'MyApp/base.html' %}
{% load static %}

{% block content %}
<div class="page-header">
    <h1>Thông tin Giao hàng</h1>
    <p>Nhập thông tin vận chuyển</p>
</div>

<div class="chart-card" style="max-width: 800px; margin: 0 auto;">
    <div class="chart-header">
        <h3><i class="fa-solid fa-truck"></i> Chi tiết vận đơn</h3>
    </div>
    <div style="padding: 2rem;">
        <form method="post">
            {% csrf_token %}
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                {% for field in form %}
                <div
                    style="display: flex; flex-direction: column; gap: 0.5rem; {% if field.name == 'NguoiGiao' %}grid-column: span 2;{% endif %}">
                    <label style="font-weight: 600; font-size: 0.875rem;">{{ field.label }}</label>
                    <div class="header-search" style="max-width: none;">
                        {{ field }}
                    </div>
                </div>
                {% endfor %}
            </div>

            <div style="margin-top: 2rem; display: flex; gap: 1rem; justify-content: flex-end;">
                <a href="{% url 'delivery_list' %}" class="leaflet-analysis-btn"
                    style="background: var(--gray-400); text-decoration: none;">Hủy</a>
                <button type="submit" class="leaflet-analysis-btn">Lưu vận đơn</button>
            </div>
        </form>
    </div>
</div>

<style>
    input,
    select,
    textarea {
        width: 100%;
        padding: 0.75rem 1rem;
        border: 1px solid var(--gray-200);
        border-radius: 8px;
        font-size: 0.875rem;
        background: var(--gray-50);
        transition: all 0.2s;
    }

    input:focus,
    select:focus,
    textarea:focus {
        outline: none;
        border-color: var(--primary);
        background: white;
    }
</style>
{% endblock %}
