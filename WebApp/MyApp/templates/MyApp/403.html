{% extends 'MyApp/base.html' %}

{% block content %}
<div
    style="height: 70vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;">
    <div style="font-size: 8rem; color: #ef4444; margin-bottom: 2rem;">
        <i class="fa-solid fa-shield-halved"></i>
    </div>
    <h1 style="font-size: 2.5rem; color: #0f172a; margin-bottom: 1rem;">Truy cập bị từ chối (403)</h1>
    <p style="font-size: 1.125rem; color: #64748b; max-width: 500px; margin-bottom: 2rem;">
        {{ message|default:"Bạn không có quyền truy cập vào chức năng này. Vui lòng liên hệ quản trị viên nếu bạn tin
        rằng đây là một sai sót." }}
    </p>
    <a href="{% url 'home' %}"
        style="padding: 0.75rem 1.5rem; background: #3b82f6; color: white; border-radius: 8px; text-decoration: none; font-weight: 600; transition: background 0.2s;">
        Quay lại Trang chủ
    </a>
</div>
{% endblock %}
