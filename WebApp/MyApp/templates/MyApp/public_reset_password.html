{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #1d4ed8; --dark: #0f172a; --light: #f8fafc; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 24px; width: 100%; max-width: 400px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); text-align: center; }
        .brand-logo { font-size: 2rem; font-weight: 800; color: var(--primary); margin-bottom: 30px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        h2 { margin-bottom: 10px; color: var(--dark); }
        p { color: #64748b; margin-bottom: 30px; font-size: 0.9rem; }
        .form-group { text-align: left; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #475569; }
        input { width: 100%; padding: 12px 16px; border: 1px solid #e2e8f0; border-radius: 12px; box-sizing: border-box; outline: none; transition: 0.2s; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        .btn-submit { background: var(--primary); color: white; border: none; padding: 14px; width: 100%; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-submit:hover { background: #1e40af; }
        .error-msg { background: #fee2e2; color: #b91c1c; padding: 10px; border-radius: 8px; margin-bottom: 20px; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand-logo"><i class="fa-solid fa-key"></i> SMART MART</div>
        <h2>Đặt lại mật khẩu</h2>
        <p>Vui lòng nhập mật khẩu mới cực kỳ bảo mật cho tài khoản của bạn.</p>

        {% if error %}
            <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Mật khẩu mới</label>
                <input type="password" name="password" required placeholder="••••••••">
            </div>
            <div class="form-group">
                <label>Xác nhận mật khẩu</label>
                <input type="password" name="confirm_password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-submit">Cập nhật mật khẩu</button>
        </form>

        <p style="margin-top: 25px; margin-bottom: 0;">
            <a href="{% url 'public_login' %}" style="color:var(--primary); text-decoration:none; font-weight:600;">Quay lại đăng nhập</a>
        </p>
    </div>
</body>
</html>
